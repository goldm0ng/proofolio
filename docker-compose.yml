services:
  db:
    image: postgres:16-alpine
    container_name: proofolio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proofolio}
      POSTGRES_USER: ${POSTGRES_USER:-proofolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofolio}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofolio}"]
      interval: 5s
      timeout: 3s
      retries: 10
